[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "cap-sim"
version = "0.1.0"
description = "Evidence-gated Code-as-Policy simulation trajectory generation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
[project.optional-dependencies]
sim = ["mujoco>=3.1,<4"]
test = ["pytest>=7"]
data = ["pandas>=2", "pyarrow>=12", "scipy>=1.10"]
g1 = ["mujoco>=3.1,<4", "scipy>=1.10", "onnxruntime==1.23.2"]
[project.scripts]
cap-sim = "cap_sim.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
