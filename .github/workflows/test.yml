name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[sim,test]'
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
